services:
  # ====================================================
  # Database Service: MongoDB (PRIVATE)
  # Internal port 27017. NOT published to host for security.
  # Persistent data volume attached to /data/db.
  # ====================================================
  mongo:
    image: mongo:7.0
    container_name: food_mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - food-net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ====================================================
  # Backend API Service: Node.js + Express (PRIVATE)
  # Internal port 5000. Communicates with MongoDB via service name 'mongo'.
  # Only accessible to frontend container via Nginx reverse proxy.
  # ====================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: food_backend
    restart: unless-stopped
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/food_delivery_db
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - food-net

  # ====================================================
  # Ingress & Frontend Service: React + Nginx (PUBLIC)
  # Port 80 is the ONLY published public port.
  # On EC2, this serves external web clients on HTTP 80.
  # ====================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: food_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - food-net

# Bridge network providing DNS-based service discovery
networks:
  food-net:
    driver: bridge

# Persistent storage volume for MongoDB documents
volumes:
  mongo_data:
    driver: local
